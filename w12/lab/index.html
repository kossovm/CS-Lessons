<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 12 Lab — Todo-lite</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Todo-lite</h1>
  </header>

  <main>
    <form id="form" class="add-row">
      <label class="sr-only" for="item">New task</label>
      <input id="item" type="text" placeholder="What needs doing?" />
      <button class="btn" type="submit">Add</button>
    </form>

    <p class="hint">Click a task to mark it done. The × deletes it.</p>

    <ul id="list" class="list"></ul>

    <p id="empty" class="empty">Nothing here yet. Add your first task.</p>
  </main>

  <footer>
    <p>CSE6624 &middot; Maksim Kossov &middot; Week 12 Lab</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>

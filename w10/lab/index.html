<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 10 Lab — Tip calculator + grade average</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Two small tools</h1>
  </header>

  <main>
    <section class="tool">
      <h2>Tip calculator</h2>
      <div class="row">
        <p class="field">
          <label for="bill">Bill</label>
          <input id="bill" type="number" min="0" step="0.01" value="1000" />
        </p>
        <p class="field">
          <label for="tip">Tip %</label>
          <input id="tip" type="number" min="0" value="10" />
        </p>
      </div>
      <p><button id="tip-btn" type="button">Calculate tip</button></p>
      <pre id="tip-out" class="out">Enter a bill and a tip percent.</pre>
    </section>

    <section class="tool">
      <h2>Grade average</h2>
      <div class="row">
        <p class="field">
          <label for="g1">Grade 1</label>
          <input id="g1" type="number" min="0" max="100" />
        </p>
        <p class="field">
          <label for="g2">Grade 2</label>
          <input id="g2" type="number" min="0" max="100" />
        </p>
        <p class="field">
          <label for="g3">Grade 3</label>
          <input id="g3" type="number" min="0" max="100" />
        </p>
      </div>
      <p><button id="avg-btn" type="button">Average</button></p>
      <pre id="avg-out" class="out">Enter three grades.</pre>
    </section>
  </main>

  <footer>
    <p>CSE6624 &middot; Maksim Kossov &middot; Week 10 Lab</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>

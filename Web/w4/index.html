<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Media Board — Week 03 Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Club Schedule</h1>
   </header>

  <main>
    <table border="2">
      <caption>Web programming lessons, autumn semester</caption>
      <thead>
        <tr>
          <th scope="col">Day</th>
          <th scope="col">Time</th>
          <th scope="col">Room</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Saturday</td><td>15:25</td><td>GUK714</td></tr>
        <tr><td>Saturday</td><td>16:30</td><td>GUK714</td></tr>
        <tr><td>Saturday</td><td>17:30</td><td>GUK714</td></tr>
      </tbody>
    </table>

    <h2>Contact</h2>
    <form method="get" action="#">
      <p>
        <label for="name">Name</label><br>
        <input id="name" name="name" type="text" required="">
      </p>
      <p>
        <label for="email">Email</label><br>
        <input id="email" name="email" type="email" required="">
      </p>
      <p>
        <label for="msg">Message</label><br>
        <textarea id="msg" name="msg" rows="4" cols="40"></textarea>
      </p>
      <button type="submit">Send</button>
    </form>
  </main>

  <footer>
    <p>CSE6624 · Maksim Kossov · Week 04 Practice</p>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tezjol Scooters — Parking zones</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="custom.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="#">Tezjol Scooters</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link active" href="#zones">Parking zones</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4" id="zones">
    <h1 class="h3 mb-1">Parking zones</h1>
    <p class="text-body-secondary">
      End your ride inside one of these. Type to filter — the page remembers your
      last filter the next time you open it.
    </p>

    <div class="row g-2 align-items-end mb-3">
      <div class="col-sm-8 col-md-6">
        <label class="form-label" for="q">Filter by zone or district</label>
        <input class="form-control" id="q" type="search" placeholder="e.g. Almaly" />
      </div>
      <div class="col-sm-4 col-md-3">
        <button class="btn btn-outline-secondary w-100" id="clear" type="button">
          Clear filter
        </button>
      </div>
    </div>

    <p class="text-body-secondary" id="count"></p>

    <div class="row g-3" id="list"></div>

    <p class="small text-body-secondary mt-3" id="store-note"></p>
  </main>

  <footer class="container py-4 text-body-secondary">
    <small class="watermark">CSE6624 | Maksim Kossov | [STUDENT ID] | niche-15</small>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="main.js"></script>
</body>
</html>
